[package]
name = "watashi-host"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Watashi — cross-platform input sharing native host binary (cursor ferry between screens)"

[[bin]]
name = "watashi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# KAMI Engine crates
kami-bridge = { git = "https://github.com/etzhayyim/kami-engine.git", rev = "c1cff42cee8b9087bfad67931a916c5bfe087638" }
kami-knp = { git = "https://github.com/etzhayyim/kami-engine.git", rev = "c1cff42cee8b9087bfad67931a916c5bfe087638" }
kami-input = { git = "https://github.com/etzhayyim/kami-engine.git", rev = "c1cff42cee8b9087bfad67931a916c5bfe087638" }
kami-ui-gpu = { git = "https://github.com/etzhayyim/kami-engine.git", rev = "c1cff42cee8b9087bfad67931a916c5bfe087638" }
kami-text = { git = "https://github.com/etzhayyim/kami-engine.git", rev = "c1cff42cee8b9087bfad67931a916c5bfe087638" }

# Kotodama host
kotodama-kami-host = { path = "../../../../packages/runtime/kotodama/kotodama-kami-host" }

# mDNS peer discovery
mdns-sd = "0.11"
hostname = "0.4"

# Window + GPU
winit = "0.29"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
